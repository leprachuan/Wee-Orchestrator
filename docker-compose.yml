# =============================================================================
# Wee Orchestrator — Docker Compose
# =============================================================================
# Quick start:
#   1. cp .env.example .env     # fill in your values
#   2. cp agents.example.json config/agents.json
#   3. docker compose up -d
#   4. Open https://localhost:8000 in your browser
#
# Bot connectors start automatically if credentials are provided:
#   Telegram: set TELEGRAM_BOT_TOKEN in .env
#   WebEx:    set WEBEX_BOT_TOKEN + RABBITMQ_PASSWORD in .env
# =============================================================================

services:
  wee-orchestrator:
    image: ghcr.io/leprachuan/wee-orchestrator:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wee-orchestrator
    restart: unless-stopped
    ports:
      - "${WEE_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      # Persistent data (sessions, scheduler jobs, logs)
      - wee-data:/data

      # --- Required ---
      # Agent config — copy from example and edit with your settings:
      #   cp agents.example.json config/agents.json
      - ./config/agents.json:/app/agents.json:ro

      # --- Telegram Bot (optional) ---
      # Mount if you want to use a config file instead of env vars.
      # Required keys: token, allowed_users (see telegram_config.example.json)
      # Alternative: just set TELEGRAM_BOT_TOKEN in .env (no file needed)
      # - ./config/telegram_config.json:/app/telegram_config.json:ro

      # --- WebEx Bot (optional) ---
      # Mount if you want to use a config file instead of env vars.
      # Required keys: token, rabbitmq_host, rabbitmq_password, rabbitmq_queue
      # Alternative: set WEBEX_BOT_TOKEN + RABBITMQ_* in .env (no file needed)
      # - ./config/webex_config.json:/app/webex_config.json:ro

      # --- Skill repositories (optional) ---
      # - ./config/skill_repositories.json:/app/skill_repositories.json:ro

      # --- SSL certificates (optional) ---
      # Uncomment and set SSL_CERTFILE/SSL_KEYFILE in .env
      # - ./certs:/data/certs:ro

    healthcheck:
      test: >
        curl -fsk https://localhost:8000/api/v1/health ||
        curl -fs  http://localhost:8000/api/v1/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  wee-data:
    driver: local
