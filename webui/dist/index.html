<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="true" />
  <meta name="apple-mobile-web-app-capable" content="true" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Wee Orchestrator" />
  <meta name="theme-color" content="#ff6b35" />
  <title>Wee — Orchestrator 🍀</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23ff6b35' rx='20'/><g transform='translate(50, 50)'><rect x='-2' y='0' width='4' height='20' fill='%232d5016'/><circle cx='0' cy='-15' r='10' fill='%23ffa500'/><circle cx='-13' cy='5' r='10' fill='%23ff9500'/><circle cx='13' cy='5' r='10' fill='%23ffb500'/></g></svg>" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23ff6b35' rx='20'/><g transform='translate(50, 50)'><rect x='-2' y='0' width='4' height='20' fill='%232d5016'/><circle cx='0' cy='-15' r='10' fill='%23ffa500'/><circle cx='-13' cy='5' r='10' fill='%23ff9500'/><circle cx='13' cy='5' r='10' fill='%23ffb500'/></g></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <!-- Auth overlay -->
  <div id="auth-overlay" class="auth-overlay hidden">
    <div class="auth-card glass-card">
      <div class="auth-logo">🍀</div>
      <h1 class="auth-title">Wee Orchestrator</h1>
      <p class="auth-subtitle">Sign in to start chatting</p>

      <!-- Step 1 -->
      <div id="auth-step1">
        <div class="form-group">
          <label id="identity-label" for="auth-identity">Telegram @username</label>
          <input id="auth-identity" type="text" class="glass-input" placeholder="@yourname" autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="auth-channel">Channel</label>
          <select id="auth-channel" class="glass-input glass-select">
            <option value="telegram">Telegram</option>
            <option value="webex">WebEx</option>
          </select>
        </div>
        <button id="btn-send-code" class="btn btn-primary btn-full">Send Pairing Code</button>
        <p id="auth-error" class="auth-error hidden"></p>
      </div>

      <!-- Step 2 -->
      <div id="auth-step2" class="hidden">
        <p class="auth-hint">Check your <span id="auth-channel-display">Telegram</span> for a 6-digit code.</p>
        <div class="form-group">
          <label for="auth-code">Pairing Code</label>
          <input id="auth-code" type="text" class="glass-input code-input" placeholder="123456" maxlength="6" inputmode="numeric" autocomplete="one-time-code" />
        </div>
        <button id="btn-verify-code" class="btn btn-primary btn-full">Verify</button>
        <button id="btn-back" class="btn btn-ghost btn-full">← Back</button>
        <p id="auth-error2" class="auth-error hidden"></p>
      </div>
    </div>
  </div>

  <!-- Main app -->
  <div id="app" class="app-layout hidden">
    <!-- Background blobs -->
    <div class="bg-blobs" aria-hidden="true">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar glass-panel">
      <div class="sidebar-header">
        <span class="sidebar-logo">🍀</span>
        <span class="sidebar-title">Wee-Orchestrator</span>
        <span id="dev-badge" class="dev-badge" style="display: none;">🔧 DEV</span>
        <button id="btn-sidebar-toggle" class="btn-icon sidebar-toggle-btn" title="Close sidebar">‹</button>
      </div>

      <!-- View switcher -->
      <div class="sidebar-nav">
        <button id="btn-nav-chat" class="sidebar-nav-btn active" title="Chat">💬 Chat</button>
        <button id="btn-nav-scheduler" class="sidebar-nav-btn" title="Scheduled Tasks">📅 Scheduler</button>
      </div>

      <button id="btn-new-chat" class="btn btn-primary new-chat-btn">+ New Chat</button>
      <div id="sessions-list" class="sessions-list"></div>
      <div class="sidebar-footer">
        <span id="sidebar-identity" class="sidebar-user"></span>
        <button id="btn-logout" class="btn btn-ghost btn-sm">Logout</button>
      </div>
    </aside>

    <!-- Chat panel -->
    <main id="chat-panel" class="main-panel">
      <!-- Header -->
      <header class="chat-header glass-panel">
        <button id="btn-open-sidebar" class="btn-icon sidebar-open-btn hidden" title="Open sidebar">☰</button>
        <div class="chat-header-info">
          <span class="chat-session-label">Session</span>
          <span id="header-session-id" class="chat-session-id">—</span>
        </div>
        <!-- Session meta pills -->
        <div id="session-meta" class="session-meta">
          <span id="meta-agent"   class="meta-pill meta-agent"   title="Agent">—</span>
          <span id="meta-runtime" class="meta-pill meta-runtime" title="Runtime">—</span>
          <span id="meta-model"   class="meta-pill meta-model"   title="Model">—</span>
          <span id="meta-mode"    class="meta-pill meta-mode"    title="Mode">restricted</span>
        </div>
      </header>

      <!-- Messages -->
      <div id="messages" class="messages-container">
        <div id="empty-state" class="empty-state">
          <div class="empty-icon">🍀</div>
          <p>Start a conversation or select a session from the sidebar.</p>
        </div>
      </div>

      <!-- Typing indicator -->
      <div id="typing-indicator" class="typing-indicator hidden">
        <div class="typing-bubble glass-bubble">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
      </div>

      <!-- Bottom area -->
      <div class="input-area">
        <!-- File preview strip -->
        <div id="file-preview-strip" class="file-preview-strip hidden"></div>
        <!-- Command typeahead dropdown -->
        <div id="cmd-dropdown" class="cmd-dropdown hidden" role="listbox"></div>
        <!-- Input bar -->
        <div class="input-bar glass-panel">
          <label for="file-input" class="btn-icon file-btn" title="Attach file">📎
            <input id="file-input" type="file" class="hidden" accept="image/*,text/*,.pdf,.json,.csv" />
          </label>
          <div class="input-wrap">
            <div id="input-mirror" class="input-mirror" aria-hidden="true"></div>
            <textarea
              id="message-input"
              class="message-textarea"
              placeholder="Message Wee… (type / for commands)"
              rows="1"
              maxlength="10000"
            ></textarea>
          </div>
          <button id="btn-send" class="btn btn-primary send-btn" disabled>▶</button>
        </div>
      </div>
    </main>

    <!-- Scheduler panel -->
    <section id="scheduler-panel" class="scheduler-panel hidden">
      <header class="sched-header glass-panel">
        <div class="sched-header-left">
          <button id="btn-sched-open-sidebar" class="btn-icon sidebar-open-btn hidden" title="Open sidebar">☰</button>
          <h2 class="sched-title">Scheduled Tasks</h2>
          <span id="sched-daemon-badge" class="sched-daemon-badge" title="Executor status"></span>
        </div>
        <div class="sched-header-actions">
          <button id="btn-sched-refresh" class="btn btn-ghost btn-sm">↺ Refresh</button>
          <button id="btn-sched-new" class="btn btn-primary btn-sm">+ New Job</button>
        </div>
      </header>

      <div class="sched-body">
        <!-- Jobs list -->
        <div id="sched-jobs-list" class="sched-jobs-list">
          <p class="sched-empty">Loading…</p>
        </div>

        <!-- Detail / form panel -->
        <aside id="sched-detail" class="sched-detail glass-panel hidden">
          <div class="sched-detail-header">
            <h3 id="sched-detail-title">Job Details</h3>
            <button id="btn-sched-detail-close" class="btn-icon" title="Close">✕</button>
          </div>
          <div id="sched-detail-body" class="sched-detail-body"></div>
        </aside>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/yaml.min.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>

<script>
  // Show DEV badge if APP_ENV is 'dev'
  async function showDevBadgeIfNeeded() {
    try {
      const response = await fetch('/api/v1/config');
      if (response.ok) {
        const config = await response.json();
        if (config.app_env === 'DEV') {
          const badge = document.getElementById('dev-badge');
          if (badge) {
            badge.style.display = 'inline-block';
          }
        }
      }
    } catch (e) {
      // Silently fail, badge stays hidden
    }
  }
  
  // Show badge on page load
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', showDevBadgeIfNeeded);
  } else {
    showDevBadgeIfNeeded();
  }
</script>

<script>
  // Enhance scheduler UI with task mode indicators
  function enhanceSchedulerUI() {
    // Watch for job items being added and set data-mode attribute
    const observer = new MutationObserver(() => {
      document.querySelectorAll('.sched-job-item').forEach(item => {
        if (!item.hasAttribute('data-mode')) {
          // Try to extract mode from item content or fetch from API
          const titleText = item.textContent || '';
          if (titleText.includes('Command')) {
            item.setAttribute('data-mode', 'command');
          } else if (titleText.includes('AI')) {
            item.setAttribute('data-mode', 'ai');
          }
        }
      });
    });
    
    const scheduler = document.getElementById('scheduler-panel');
    if (scheduler) {
      observer.observe(scheduler, { childList: true, subtree: true });
    }
  }
  
  // Initialize when scheduler panel is shown
  document.addEventListener('DOMContentLoaded', () => {
    setTimeout(enhanceSchedulerUI, 500);
  });
</script>

<script>
  // Enhance job edit form with task mode toggle
  function enhanceJobEditForm() {
    const observer = new MutationObserver(() => {
      const form = document.querySelector('#sched-job-form');
      if (form && !form.hasAttribute('data-mode-enhanced')) {
        form.setAttribute('data-mode-enhanced', 'true');
        injectModeToggle(form);
      }
    });
    
    const detail = document.getElementById('sched-detail');
    if (detail) {
      observer.observe(detail, { childList: true, subtree: true });
    }
  }
  
  function injectModeToggle(form) {
    // Find where to inject the toggle (after name field)
    const nameGroup = form.querySelector('input[name="name"]')?.closest('.form-group');
    if (!nameGroup) return;
    
    // Get current mode value
    const currentMode = form.querySelector('input[name="mode"]')?.value || 'ai';
    
    // Create toggle HTML
    const toggleHTML = `
      <div class="task-mode-toggle">
        <span class="task-mode-label">Task Type:</span>
        <div class="toggle-switch">
          <button type="button" class="toggle-option ${currentMode === 'ai' ? 'active ai' : ''}" data-mode="ai">🤖 AI</button>
          <button type="button" class="toggle-option ${currentMode === 'command' ? 'active command' : ''}" data-mode="command">⚙️ Command</button>
        </div>
      </div>
    `;
    
    // Insert toggle after name group
    nameGroup.insertAdjacentHTML('afterend', toggleHTML);
    
    // Mark form with mode class
    form.classList.add(`task-mode-${currentMode}`);
    
    // Add hidden input to store mode
    if (!form.querySelector('input[name="task-mode-value"]')) {
      const hiddenMode = document.createElement('input');
      hiddenMode.type = 'hidden';
      hiddenMode.name = 'task-mode-value';
      hiddenMode.value = currentMode;
      form.appendChild(hiddenMode);
    }
    
    // Mark runtime/model as AI-only
    const runtimeGroup = form.querySelector('input[name="runtime"]')?.closest('.form-group');
    const modelGroup = form.querySelector('input[name="model"]')?.closest('.form-group');
    if (runtimeGroup) runtimeGroup.classList.add('ai-only');
    if (modelGroup) modelGroup.classList.add('ai-only');
    
    // Mark working_dir as command-only (or create if missing)
    let workingDirGroup = form.querySelector('input[name="working_dir"]')?.closest('.form-group');
    if (!workingDirGroup) {
      const taskGroup = form.querySelector('textarea[name="task"]')?.closest('.form-group');
      if (taskGroup) {
        const workingDirHTML = `
          <div class="form-group command-only">
            <label>Working Directory</label>
            <input class="glass-input" name="working_dir" placeholder="/opt" />
            <p class="form-hint">Directory where the command will execute</p>
          </div>
        `;
        taskGroup.insertAdjacentHTML('beforebegin', workingDirHTML);
      }
    } else {
      workingDirGroup.classList.add('command-only');
    }
    
    // Handle toggle clicks
    form.querySelectorAll('.toggle-option').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const mode = btn.dataset.mode;
        
        // Update form class
        form.classList.remove('task-mode-ai', 'task-mode-command');
        form.classList.add(`task-mode-${mode}`);
        
        // Update button states
        form.querySelectorAll('.toggle-option').forEach(b => {
          b.classList.remove('active', 'ai', 'command');
          if (b.dataset.mode === mode) {
            b.classList.add('active', mode);
          }
        });
        
        // Update hidden input
        form.querySelector('input[name="task-mode-value"]').value = mode;
        
        // Update actual mode field (for submission)
        const modeField = form.querySelector('input[name="mode"]');
        if (modeField) {
          modeField.value = mode;
        }
      });
    });
  }
  
  // Initialize when scheduler panel is shown
  document.addEventListener('DOMContentLoaded', () => {
    setTimeout(enhanceJobEditForm, 500);
  });
</script>
