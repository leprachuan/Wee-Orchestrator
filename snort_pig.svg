<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <defs>
    <linearGradient id="pinkGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#ffd1dc"/>
      <stop offset="1" stop-color="#ff9ab8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="100%" height="100%" fill="#f7fbff"/>

  <!-- pig body -->
  <ellipse cx="520" cy="330" rx="260" ry="160" fill="url(#pinkGrad)" stroke="#e56f8a" stroke-width="6" filter="url(#shadow)"/>

  <!-- head -->
  <circle cx="300" cy="280" r="95" fill="url(#pinkGrad)" stroke="#e56f8a" stroke-width="6"/>

  <!-- snout -->
  <ellipse cx="270" cy="305" rx="46" ry="34" fill="#ffc0cc" stroke="#e56f8a" stroke-width="4"/>
  <circle cx="260" cy="300" r="6" fill="#a63a4d"/>
  <circle cx="280" cy="300" r="6" fill="#a63a4d"/>

  <!-- eyes -->
  <circle cx="325" cy="265" r="10" fill="#2b2b2b"/>
  <circle cx="285" cy="265" r="10" fill="#2b2b2b"/>

  <!-- ears -->
  <path d="M240 220 Q220 200 260 210" fill="#ff9ab8" stroke="#e56f8a" stroke-width="4"/>
  <path d="M340 220 Q360 200 320 210" fill="#ff9ab8" stroke="#e56f8a" stroke-width="4"/>

  <!-- legs -->
  <rect x="360" y="430" width="32" height="60" rx="8" fill="#ff9ab8" stroke="#e56f8a" stroke-width="4"/>
  <rect x="460" y="430" width="32" height="60" rx="8" fill="#ff9ab8" stroke="#e56f8a" stroke-width="4"/>
  <rect x="580" y="430" width="32" height="60" rx="8" fill="#ff9ab8" stroke="#e56f8a" stroke-width="4"/>
  <rect x="700" y="430" width="32" height="60" rx="8" fill="#ff9ab8" stroke="#e56f8a" stroke-width="4"/>

  <!-- tail -->
  <path d="M760 320 C790 300 810 340 760 350" stroke="#e56f8a" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- network/snort motif on body (stylized packet) -->
  <g transform="translate(520,320)">
    <rect x="-65" y="-25" width="130" height="50" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="5"/>
    <circle cx="-25" cy="0" r="8" fill="#3b82f6"/>
    <circle cx="0" cy="0" r="8" fill="#3b82f6"/>
    <circle cx="25" cy="0" r="8" fill="#3b82f6"/>
    <text x="0" y="6" font-family="Verdana" font-size="14" text-anchor="middle" fill="#3b82f6">SNORT</text>
  </g>

  <!-- text label -->
  <text x="520" y="80" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#0f172a" text-anchor="middle">Cisco Snort Pig</text>

  <!-- small Cisco-like badge (simple shield) -->
  <g transform="translate(820,80) scale(1.2)">
    <path d="M0 0 L30 0 L40 20 L20 48 L0 20 Z" fill="#005073" stroke="#01303b" stroke-width="2"/>
    <text x="20" y="28" font-size="10" font-family="Verdana" fill="#fff" text-anchor="middle">C</text>
  </g>

  <!-- subtle ground -->
  <ellipse cx="520" cy="520" rx="360" ry="30" fill="#eaeef7"/>

</svg>
