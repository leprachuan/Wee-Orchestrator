name: WeeOrchestratorClient
options:
  bundleIdPrefix: com.weeorchestrator
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
    SUPPORTS_MACCATALYST: false

targets:
  WeeOrchestratorClient:
    type: application
    platform: iOS
    sources:
      - path: Sources/WeeOrchestratorClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weeorchestrator.client
        PRODUCT_NAME: "Wee Orchestrator"
        # PRODUCT_NAME's space makes Swift sanitize the module name to
        # Wee_Orchestrator; pinning it keeps `@testable import
        # WeeOrchestratorClient` (used throughout Tests/) resolving correctly.
        PRODUCT_MODULE_NAME: WeeOrchestratorClient
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "Wee Orchestrator"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Allows connecting to local/dev backends over HTTP or with
        # self-signed TLS certificates. Tighten this (per-domain
        # exceptions) before distributing the app.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  WeeOrchestratorClientTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/WeeOrchestratorClientTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weeorchestrator.client.tests
        # The app target's PRODUCT_NAME is "Wee Orchestrator" (with a
        # space, for CFBundleDisplayName), not the WeeOrchestratorClient
        # XcodeGen infers by default -- without this override, TEST_HOST
        # points at a binary that doesn't exist and the test bundle never
        # builds.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Wee Orchestrator.app/Wee Orchestrator"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: WeeOrchestratorClient

schemes:
  WeeOrchestratorClient:
    build:
      targets:
        WeeOrchestratorClient: all
        WeeOrchestratorClientTests: [test]
    test:
      targets:
        - WeeOrchestratorClientTests
